# PostgreSQL tuning for the World Library demo (Docker VM ~8 GB RAM, SSD).
# Production sizing guidance is in docs/ARCHITECTURE.md.
listen_addresses = '*'
max_connections = 200                  # app pools are small; put PgBouncer in front for more clients
shared_buffers = 1GB                   # ~25% of RAM available to the DB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 512MB           # index builds after bulk load
wal_buffers = 64MB
max_wal_size = 512MB                   # bounded: shared Docker disk in this environment; use 16-64GB on a dedicated host
min_wal_size = 80MB
wal_recycle = off                      # shared disk: delete old WAL segments instead of keeping them for reuse
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = on
random_page_cost = 1.1                 # SSD
effective_io_concurrency = 200
max_worker_processes = 12
max_parallel_workers = 8
max_parallel_workers_per_gather = 0    # OLTP: short LIMIT queries; parallel workers only add CPU contention under load
max_parallel_maintenance_workers = 4
jit = off                              # OLTP-style short queries: JIT only adds latency
default_statistics_target = 200
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
autovacuum_max_workers = 4
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000
idle_in_transaction_session_timeout = 60s
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
track_io_timing = on
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
timezone = 'UTC'
