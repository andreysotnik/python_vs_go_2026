[project]
name = "profanity-filter"
version = "0.1.0"
description = "Regex-based profanity filter (Russian mat + basic English) with obfuscation handling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
profanity = "profanity_filter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/profanity_filter"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
