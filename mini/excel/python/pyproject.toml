[project]
name = "sales-report"
version = "1.0.0"
description = "CLI: очистка выгрузки продаж из Excel, агрегаты, графики и HTML-отчёт"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.scripts]
sales-report = "sales_report.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_report"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PL", "PT", "C4", "RET"]
ignore = [
    "PLR2004",  # «магические» числа в тестах и формате графиков уместны
    "PLR0913",
    "RUF001",   # кириллица в строках/докстрингах/комментариях — это русский текст,
    "RUF002",   # а не «похожие» латинские буквы
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
