name: mini_mailer_python

services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "11025:1025"   # SMTP
      - "18025:8025"   # Web UI + REST API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 15

  mailer:
    build: .
    image: mini_mailer_python-mailer:latest
    command: ["run", "--config", "/app/config/jobs.yaml"]
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      SMTP_FROM: "Рассылка <mailer@example.com>"
      # SMTP_USER / SMTP_PASSWORD are optional (Mailpit accepts anonymous SMTP).
      STATE_DIR: /var/lib/mailer
      LOG_LEVEL: INFO
    volumes:
      - ./examples:/app/config:ro
      - mailer-state:/var/lib/mailer
    depends_on:
      mailpit:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  mailer-state:
