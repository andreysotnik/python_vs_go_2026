[package]
name = "world_library"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "World Library catalog backend (axum + sqlx + PostgreSQL)"

[lib]
name = "world_library"
path = "src/lib.rs"

[[bin]]
name = "world-library"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
prometheus = { version = "0.13", default-features = false }
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "catch-panic", "limit", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
serde_yaml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
