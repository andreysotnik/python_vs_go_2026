# PostgreSQL tuning for the World Library (container with ~8 GB RAM budget, SSD).
listen_addresses = '*'
max_connections = 200                 # app pool(s) + seed workers; use PgBouncer in front in prod

# memory
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 32MB
maintenance_work_mem = 1GB
huge_pages = try

# planner: SSD, partitioned tables
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200
enable_partition_pruning = on
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
jit = off                             # short OLTP queries: JIT compile cost > benefit

# parallelism
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 4

# WAL / checkpoints (bulk loads)
wal_level = replica                   # 'logical' when CDC to OpenSearch is enabled
wal_compression = lz4
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_buffers = 64MB

# autovacuum: big tables need proportional thresholds turned down
autovacuum_max_workers = 4
autovacuum_naptime = 15s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000

# safety nets (the app also sets a per-transaction statement_timeout)
statement_timeout = 0
idle_in_transaction_session_timeout = 60s
lock_timeout = 10s

# observability
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
