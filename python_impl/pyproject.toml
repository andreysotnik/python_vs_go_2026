[project]
name = "world-library"
version = "1.0.0"
description = "World Library catalog API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "asyncpg-stubs>=0.30",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs PostgreSQL (testcontainers or TEST_DATABASE_URL)",
    "perf: EXPLAIN checks against a seeded database (PERF_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*"]

[tool.coverage.run]
source = ["library"]
omit = ["src/library/seed/__main__.py"]

[tool.coverage.report]
show_missing = false
skip_covered = true
precision = 1

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PL", "BLE"]
ignore = ["S101", "S608", "PLR0913", "PLR0912", "PLR0915", "PLR2004", "RUF001", "RUF003", "PLR0911", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802"]
"src/library/seed/**" = ["S311"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["library"]
plugins = ["pydantic.mypy"]
