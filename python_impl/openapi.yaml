openapi: 3.1.0
info:
  title: World Library API
  description: '

    World Library catalog API.


    * **Pagination** is keyset-only: pass `next_cursor` back as `cursor`. No OFFSET.

    * **Totals** are planner estimates (`include_total=true` -> `total_is_estimate:
    true`).

    * **Ids** are 63-bit snowflake ids serialised as decimal strings.

    * **Writes** require `X-User-Id`; updates require `If-Match: "<version>"` (or
    `version` in the body).

    * **Errors** are RFC 7807 `application/problem+json`.

    '
  version: 1.0.0
paths:
  /api/v1/books:
    get:
      tags:
      - books
      summary: List/search books (keyset pagination)
      operationId: list_books_api_v1_books_get
      parameters:
      - name: sort
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[+-]?(title|publication_year|created_at)$
          - type: 'null'
          description: title | publication_year | created_at, prefix '-' for descending
            (default -created_at)
          title: Sort
        description: title | publication_year | created_at, prefix '-' for descending
          (default -created_at)
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100
            minimum: 1
          - type: 'null'
          description: page size, 1..100 (default 20)
          title: Limit
        description: page size, 1..100 (default 20)
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          description: opaque cursor from `next_cursor` of the previous page
          title: Cursor
        description: opaque cursor from `next_cursor` of the previous page
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          description: return an approximate total (planner estimate, never COUNT(*))
          default: false
          title: Include Total
        description: return an approximate total (planner estimate, never COUNT(*))
      - name: title
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 200
          - type: 'null'
          description: substring/fuzzy title match (trigram)
          title: Title
        description: substring/fuzzy title match (trigram)
      - name: author
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 200
          - type: 'null'
          description: author name (full-text, prefix on last word)
          title: Author
        description: author name (full-text, prefix on last word)
      - name: author_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: books of this author
          title: Author Id
        description: books of this author
      - name: isbn
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          description: ISBN-10 or ISBN-13, hyphens allowed
          title: Isbn
        description: ISBN-10 or ISBN-13, hyphens allowed
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Za-z]{2,3}$
          - type: 'null'
          description: ISO 639 code
          title: Language
        description: ISO 639 code
      - name: year_from
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 2100
            minimum: -3000
          - type: 'null'
          title: Year From
      - name: year_to
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 2100
            minimum: -3000
          - type: 'null'
          title: Year To
      - name: publisher
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 256
          - type: 'null'
          description: exact publisher name
          title: Publisher
        description: exact publisher name
      - name: genre
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
          title: Genre
      - name: created_by
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: user id who created the book
          title: Created By
        description: user id who created the book
      - name: created_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: created_at >= (RFC 3339)
          title: Created From
        description: created_at >= (RFC 3339)
      - name: created_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: created_at <= (RFC 3339)
          title: Created To
        description: created_at <= (RFC 3339)
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
          description: full-text query (websearch syntax)
          title: Q
        description: full-text query (websearch syntax)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Book_'
        '400':
          description: Malformed request (bad cursor, unsupported sort, malformed
            JSON, bad If-Match)
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Query timeout or database unavailable
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - books
      summary: Create a book
      operationId: create_book_api_v1_books_post
      security:
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCard'
        '400':
          description: Malformed request (bad cursor, unsupported sort, malformed
