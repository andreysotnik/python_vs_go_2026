# Tuned for the Docker Desktop VM of the dev box (12 vCPU, ~8 GB RAM shared with other stacks):
# a bulk-load + read-heavy API workload. Scale shared_buffers to ~25% of RAM on real hardware.
listen_addresses = '*'
max_connections = 200
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
max_parallel_maintenance_workers = 4
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
random_page_cost = 1.1
effective_io_concurrency = 200
wal_level = logical                 # ready for CDC (Debezium -> OpenSearch)
max_wal_senders = 10
max_replication_slots = 10
wal_compression = on
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_buffers = 64MB
default_statistics_target = 200
jit = off                           # JIT hurts short OLTP queries
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
track_io_timing = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
log_min_duration_statement = 500
log_checkpoints = on
autovacuum_max_workers = 4
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
idle_in_transaction_session_timeout = 60s
